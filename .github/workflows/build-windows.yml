name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --onefile --clean --name AnkiToFlashcardsDeluxe anki_to_fdx.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: AnkiToFlashcardsDeluxe-Windows
          path: dist/AnkiToFlashcardsDeluxe.exe
